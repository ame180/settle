name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [ staging, production ]
        default: staging
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

env:
  # Production releases run under their version tag; everything else under the commit.
  IMAGE_TAG: ${{ github.ref_type == 'tag' && (inputs.environment || 'production') == 'production' && github.ref_name || format('sha-{0}', github.sha) }}
  IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build images
    needs: ci
    runs-on: ubuntu-latest
    # Only this job can push images; the CI gates run dependency code with a read-only token.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: prod
            image: ghcr.io/ame180/settle-php
          - target: web
            image: ghcr.io/ame180/settle-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=${{ env.IMAGE_TAG }},enable=${{ env.IMAGE_TAG != format('sha-{0}', github.sha) }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: deploy/compose.yaml
          target: ${{ secrets.APP_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: APP_PATH,IMAGE_TAG,IMAGE_SOURCE
          script: |
            set -eu
            cd "$APP_PATH"
            test -f .env || { echo "$APP_PATH/.env is missing, see DEPLOYMENT.md" >&2; exit 1; }
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi
            docker compose pull --quiet
            docker compose up -d --wait --wait-timeout 300 --remove-orphans || {
              docker compose ps
              docker compose logs --tail 50
              exit 1
            }
            # Exact tags never become dangling. The age filter spares images the other environment just pulled.
            docker image prune -af --filter "label=org.opencontainers.image.source=$IMAGE_SOURCE" --filter until=1h
