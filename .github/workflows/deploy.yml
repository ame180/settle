name: Deploy

# Staging: run manually from any branch. Production: push a v* tag (or run manually from one).
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
  IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build images
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: prod
            image: ghcr.io/ame180/settle-php
          - target: web
            image: ghcr.io/ame180/settle-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          pull: true
          # The source label links the package to this repo and scopes the server's image prune.
          labels: org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', matrix.image, github.ref_name) || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy to ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: deploy/compose.yaml
          target: ${{ secrets.APP_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: APP_PATH,IMAGE_TAG,IMAGE_SOURCE
          script: |
            set -eu
            cd "$APP_PATH"
            test -f .env || { echo "$APP_PATH/.env is missing, see DEPLOYMENT.md" >&2; exit 1; }
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
            else
              echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            fi
            docker compose pull --quiet
            docker compose up -d --wait --wait-timeout 300 --remove-orphans || {
              docker compose ps
              docker compose logs --tail 50
              exit 1
            }
            # Exact tags never become dangling, so remove this app's unused images explicitly.
            docker image prune -af --filter "label=org.opencontainers.image.source=$IMAGE_SOURCE"
