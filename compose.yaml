
services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    volumes:
      - .:/app
    env_file: .env
    entrypoint: docker/entrypoint.sh
    # php-fpm only listens once dependencies are installed and migrations have run.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      start_period: 300s
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy

  # Long-running: restart it to pick up code changes.
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    volumes:
      - .:/app
    env_file: .env
    entrypoint: ["sh", "-c", "bin/console app:recurring:run && exec bin/console messenger:consume scheduler_default --memory-limit=128M"]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy

  nginx:
    image: ghcr.io/ame180/nginx-php:latest
    environment:
      APP_PATH: /app
    volumes:
      - .:/app
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - php

  mysql:
    image: ghcr.io/ame180/mariadb:12.3
    environment:
      MARIADB_AUTO_UPGRADE: 1
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - mysql:/var/lib/mysql

volumes:
  mysql: